name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # Project Pages (e.g. user.github.io/repo/) needs a non-empty base path or
      # /_next CSS and JS load from the domain root and styling breaks.
      - name: Set NEXT_PUBLIC_BASE_PATH for GitHub Pages
        run: |
          REPO="${GITHUB_REPOSITORY##*/}"
          OVERRIDE="${{ vars.NEXT_PUBLIC_BASE_PATH }}"
          if [ -n "$OVERRIDE" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=$OVERRIDE" >> "$GITHUB_ENV"
            echo "Using repository variable NEXT_PUBLIC_BASE_PATH"
          elif [[ "$REPO" =~ \.github\.io$ ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "User/org site repo (*.github.io): empty base path"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
            echo "Project site: base path /$REPO"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
